name: pi-turbo-portfolio-monitor
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor-local
      POSTGRES_DB: portfolio_monitor
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["monitor-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d portfolio_monitor"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["monitor-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  monitor-postgres:
  monitor-redis:
